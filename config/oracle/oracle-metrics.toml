)
WHERE rownum <= 50
"

[[metric]]
context = "oracle_tablespace_usage"
labels = ["tablespace_name", "contents", "status"]
metricsdesc = { used_percent = "Tablespace used percent", used_gb = "Tablespace used GB", free_gb = "Tablespace free GB", total_gb = "Tablespace total GB" }
request = "
SELECT df.tablespace_name,
       NVL(ts.contents, 'UNKNOWN') AS contents,
       NVL(ts.status, 'UNKNOWN') AS status,
       ROUND((df.total_bytes - NVL(fs.free_bytes, 0)) / df.total_bytes * 100, 2) AS used_percent,
       ROUND((df.total_bytes - NVL(fs.free_bytes, 0)) / 1024 / 1024 / 1024, 2) AS used_gb,
       ROUND(NVL(fs.free_bytes, 0) / 1024 / 1024 / 1024, 2) AS free_gb,
       ROUND(df.total_bytes / 1024 / 1024 / 1024, 2) AS total_gb
FROM (
  SELECT tablespace_name, SUM(bytes) AS total_bytes
  FROM dba_data_files
  GROUP BY tablespace_name
) df
LEFT JOIN (
  SELECT tablespace_name, SUM(bytes) AS free_bytes
  FROM dba_free_space
  GROUP BY tablespace_name
) fs ON df.tablespace_name = fs.tablespace_name
LEFT JOIN dba_tablespaces ts ON df.tablespace_name = ts.tablespace_name
"

[[metric]]
context = "oracle_temp_usage"
labels = ["tablespace_name"]
metricsdesc = { used_percent = "Temporary tablespace used percent", used_gb = "Temporary tablespace used GB", total_gb = "Temporary tablespace total GB" }
request = "
SELECT tf.tablespace_name,
       ROUND(NVL(tu.used_bytes, 0) / tf.total_bytes * 100, 2) AS used_percent,
       ROUND(NVL(tu.used_bytes, 0) / 1024 / 1024 / 1024, 2) AS used_gb,
       ROUND(tf.total_bytes / 1024 / 1024 / 1024, 2) AS total_gb
FROM (
  SELECT tablespace_name, SUM(bytes) AS total_bytes
  FROM dba_temp_files
  GROUP BY tablespace_name
) tf
LEFT JOIN (
  SELECT tablespace_name, SUM(bytes_used) AS used_bytes
  FROM v$temp_space_header
  GROUP BY tablespace_name
) tu ON tf.tablespace_name = tu.tablespace_name
"

[[metric]]
context = "oracle_fra_usage"
labels = ["file_type"]
metricsdesc = { used_percent = "FRA used percent by file type", used_gb = "FRA used GB by file type", reclaimable_gb = "FRA reclaimable GB by file type" }
request = "
SELECT file_type,
       percent_space_used AS used_percent,
       ROUND(space_used / 1024 / 1024 / 1024, 2) AS used_gb,
       ROUND(space_reclaimable / 1024 / 1024 / 1024, 2) AS reclaimable_gb
FROM v$flash_recovery_area_usage
"

[[metric]]
context = "oracle_fra_limit"
metricsdesc = { value = "FRA limit GB" }
request = "
SELECT ROUND(space_limit / 1024 / 1024 / 1024, 2) AS value
FROM v$recovery_file_dest
"

[[metric]]
context = "oracle_rac_instance_status"
labels = ["inst_id", "instance_name", "host_name", "status"]
metricsdesc = { value = "RAC instance status" }
request = "
SELECT TO_CHAR(inst_id) AS inst_id,
       instance_name,
       host_name,
       status,
       1 AS value
FROM gv$instance
"

[[metric]]
context = "oracle_rac_active_sessions"
labels = ["inst_id", "instance_name"]
metricsdesc = { value = "RAC active sessions by instance" }
request = "
SELECT TO_CHAR(s.inst_id) AS inst_id,
       i.instance_name,
       COUNT(*) AS value
FROM gv$session s
JOIN gv$instance i ON s.inst_id = i.inst_id
WHERE s.status = 'ACTIVE'
GROUP BY s.inst_id, i.instance_name
"

[[metric]]
context = "oracle_rac_blocked_sessions"
labels = ["inst_id", "instance_name"]
metricsdesc = { value = "RAC blocked sessions by instance" }
request = "
SELECT TO_CHAR(s.inst_id) AS inst_id,
       i.instance_name,
       COUNT(*) AS value
FROM gv$session s
JOIN gv$instance i ON s.inst_id = i.inst_id
WHERE s.blocking_session IS NOT NULL
GROUP BY s.inst_id, i.instance_name
"

[[metric]]
context = "oracle_rac_wait_class"
labels = ["inst_id", "instance_name", "wait_class"]
metricsdesc = { value = "RAC active sessions by wait class" }
request = "
SELECT TO_CHAR(s.inst_id) AS inst_id,
       i.instance_name,
       NVL(s.wait_class, 'UNKNOWN') AS wait_class,
       COUNT(*) AS value
FROM gv$session s
JOIN gv$instance i ON s.inst_id = i.inst_id
WHERE s.status = 'ACTIVE'
AND NVL(s.wait_class, 'UNKNOWN') <> 'Idle'
GROUP BY s.inst_id, i.instance_name, NVL(s.wait_class, 'UNKNOWN')
"

[[metric]]
context = "oracle_rac_gc_waits"
labels = ["inst_id", "instance_name", "event"]
metricsdesc = { value = "RAC global cache waits" }
request = "
SELECT TO_CHAR(s.inst_id) AS inst_id,
       i.instance_name,
       s.event,
       COUNT(*) AS value
FROM gv$session s
JOIN gv$instance i ON s.inst_id = i.inst_id
WHERE s.status = 'ACTIVE'
AND s.event LIKE 'gc%'
GROUP BY s.inst_id, i.instance_name, s.event
"

[[metric]]
context = "oracle_services_status"
labels = ["inst_id", "name", "network_name"]
metricsdesc = { value = "Oracle services status by instance" }
request = "
SELECT TO_CHAR(inst_id) AS inst_id,
       name,
       NVL(network_name, 'UNKNOWN') AS network_name,
       1 AS value
FROM gv$active_services
WHERE name NOT LIKE 'SYS$%'
"

[[metric]]
context = "oracle_asm_diskgroup_usage"
labels = ["name", "state", "type"]
metricsdesc = { used_percent = "ASM diskgroup used percent", free_gb = "ASM diskgroup free GB", total_gb = "ASM diskgroup total GB" }
request = "
SELECT name,
       state,
       type,
       ROUND((total_mb - free_mb) / NULLIF(total_mb, 0) * 100, 2) AS used_percent,
       ROUND(free_mb / 1024, 2) AS free_gb,
       ROUND(total_mb / 1024, 2) AS total_gb
FROM v$asm_diskgroup
"

[[metric]]
context = "oracle_asm_operation"
labels = ["group_number", "operation", "state", "power"]
metricsdesc = { value = "ASM rebalance or operation estimate minutes" }
request = "
SELECT TO_CHAR(group_number) AS group_number,
       operation,
       state,
       TO_CHAR(power) AS power,
       NVL(est_minutes, 0) AS value
FROM v$asm_operation
"

[[metric]]
context = "oracle_sql_plan_hash"
labels = ["sql_id", "plan_hash_value"]
metricsdesc = { value = "SQL plan hash value mapping" }
request = """
SELECT sql_id,
       TO_CHAR(plan_hash_value) AS plan_hash_value,
       1 AS value
FROM (
  SELECT sql_id, plan_hash_value
  FROM v$sql
  WHERE sql_id IS NOT NULL
  AND plan_hash_value IS NOT NULL
  ORDER BY last_active_time DESC
)
WHERE rownum <= 50
"""

[[metric]]
context = "oracle_sql_workload_delta"
labels = ["sql_id", "plan_hash_value", "parsing_schema", "module", "action", "service_name"]
metricsdesc = { elapsed_time_us = "Cumulative SQL elapsed time in microseconds", cpu_time_us = "Cumulative SQL CPU time in microseconds", executions = "Cumulative SQL executions", buffer_gets = "Cumulative SQL buffer gets", disk_reads = "Cumulative SQL disk reads", rows_processed = "Cumulative SQL rows processed", parse_calls = "Cumulative SQL parse calls" }
request = """
SELECT sql_id,
       TO_CHAR(plan_hash_value) AS plan_hash_value,
       parsing_schema,
       module,
       action,
       service_name,
       elapsed_time_us,
       cpu_time_us,
       executions,
       buffer_gets,
       disk_reads,
       rows_processed,
       parse_calls
FROM (
  SELECT sql_id,
         plan_hash_value,
         SUBSTR(NVL(parsing_schema_name, 'UNKNOWN'), 1, 40) AS parsing_schema,
         SUBSTR(NVL(module, 'UNKNOWN'), 1, 60) AS module,
         SUBSTR(NVL(action, 'UNKNOWN'), 1, 60) AS action,
         SUBSTR(NVL(service, 'UNKNOWN'), 1, 60) AS service_name,
         SUM(elapsed_time) AS elapsed_time_us,
         SUM(cpu_time) AS cpu_time_us,
         SUM(executions) AS executions,
         SUM(buffer_gets) AS buffer_gets,
         SUM(disk_reads) AS disk_reads,
         SUM(rows_processed) AS rows_processed,
         SUM(parse_calls) AS parse_calls
  FROM v$sql
  WHERE sql_id IS NOT NULL
  AND last_active_time >= SYSDATE - (1 / 24)
  GROUP BY sql_id,
           plan_hash_value,
           SUBSTR(NVL(parsing_schema_name, 'UNKNOWN'), 1, 40),
           SUBSTR(NVL(module, 'UNKNOWN'), 1, 60),
           SUBSTR(NVL(action, 'UNKNOWN'), 1, 60),
           SUBSTR(NVL(service, 'UNKNOWN'), 1, 60)
  ORDER BY SUM(elapsed_time) DESC
)
WHERE rownum <= 50
"""

[[metric]]
context = "oracle_session_wait_sql"
labels = ["sql_id", "plan_hash_value", "wait_class", "event", "username", "module", "action", "service_name", "machine"]
metricsdesc = { value = "Active sessions attributed to SQL, wait, module, service, and machine" }
request = """
SELECT NVL(s.sql_id, 'UNKNOWN') AS sql_id,
       TO_CHAR(NVL(q.plan_hash_value, 0)) AS plan_hash_value,
       NVL(s.wait_class, 'UNKNOWN') AS wait_class,
       SUBSTR(NVL(s.event, 'UNKNOWN'), 1, 80) AS event,
       NVL(s.username, 'UNKNOWN') AS username,
       SUBSTR(NVL(s.module, 'UNKNOWN'), 1, 60) AS module,
       SUBSTR(NVL(s.action, 'UNKNOWN'), 1, 60) AS action,
       SUBSTR(NVL(s.service_name, 'UNKNOWN'), 1, 60) AS service_name,
       SUBSTR(NVL(s.machine, 'UNKNOWN'), 1, 80) AS machine,
       COUNT(*) AS value
FROM v$session s
LEFT JOIN v$sql q ON s.sql_id = q.sql_id AND s.sql_child_number = q.child_number
WHERE s.status = 'ACTIVE'
AND s.type = 'USER'
AND NVL(s.wait_class, 'UNKNOWN') <> 'Idle'
GROUP BY NVL(s.sql_id, 'UNKNOWN'),
         TO_CHAR(NVL(q.plan_hash_value, 0)),
         NVL(s.wait_class, 'UNKNOWN'),
         SUBSTR(NVL(s.event, 'UNKNOWN'), 1, 80),
         NVL(s.username, 'UNKNOWN'),
         SUBSTR(NVL(s.module, 'UNKNOWN'), 1, 60),
         SUBSTR(NVL(s.action, 'UNKNOWN'), 1, 60),
         SUBSTR(NVL(s.service_name, 'UNKNOWN'), 1, 60),
         SUBSTR(NVL(s.machine, 'UNKNOWN'), 1, 80)
"""

[[metric]]
context = "oracle_blocking_sql"
labels = ["blocking_sid", "blocking_sql_id", "blocked_sql_id", "blocking_user", "blocked_user", "wait_class", "event"]
metricsdesc = { value = "Blocking relationships attributed to blocking and blocked SQL IDs" }
request = """
SELECT TO_CHAR(b.sid) AS blocking_sid,
       NVL(b.sql_id, 'UNKNOWN') AS blocking_sql_id,
       NVL(s.sql_id, 'UNKNOWN') AS blocked_sql_id,
       NVL(b.username, 'UNKNOWN') AS blocking_user,
       NVL(s.username, 'UNKNOWN') AS blocked_user,
       NVL(s.wait_class, 'UNKNOWN') AS wait_class,
       SUBSTR(NVL(s.event, 'UNKNOWN'), 1, 80) AS event,
       COUNT(*) AS value
FROM v$session s
JOIN v$session b ON s.blocking_session = b.sid
WHERE s.blocking_session IS NOT NULL
GROUP BY TO_CHAR(b.sid),
         NVL(b.sql_id, 'UNKNOWN'),
         NVL(s.sql_id, 'UNKNOWN'),
         NVL(b.username, 'UNKNOWN'),
         NVL(s.username, 'UNKNOWN'),
         NVL(s.wait_class, 'UNKNOWN'),
         SUBSTR(NVL(s.event, 'UNKNOWN'), 1, 80)
"""

[[metric]]
context = "oracle_sql_plan_count"
labels = ["sql_id"]
metricsdesc = { value = "Number of currently cached execution plans per SQL ID" }
request = """
SELECT sql_id,
       COUNT(DISTINCT plan_hash_value) AS value
FROM v$sql
WHERE sql_id IS NOT NULL
AND plan_hash_value IS NOT NULL
AND last_active_time >= SYSDATE - 1
GROUP BY sql_id
HAVING COUNT(DISTINCT plan_hash_value) > 1
"""

[[metric]]
context = "oracle_tablespace_usage"
labels = ["tablespace_name", "contents", "status"]
metricsdesc = { used_percent = "Tablespace used percent", used_gb = "Tablespace used GB", free_gb = "Tablespace free GB", total_gb = "Tablespace total GB" }
request = """
SELECT df.tablespace_name,
       NVL(ts.contents, 'UNKNOWN') AS contents,
       NVL(ts.status, 'UNKNOWN') AS status,
       ROUND((df.total_bytes - NVL(fs.free_bytes, 0)) / df.total_bytes * 100, 2) AS used_percent,
       ROUND((df.total_bytes - NVL(fs.free_bytes, 0)) / 1024 / 1024 / 1024, 2) AS used_gb,
       ROUND(NVL(fs.free_bytes, 0) / 1024 / 1024 / 1024, 2) AS free_gb,
       ROUND(df.total_bytes / 1024 / 1024 / 1024, 2) AS total_gb
FROM (
  SELECT tablespace_name, SUM(bytes) AS total_bytes
  FROM dba_data_files
  GROUP BY tablespace_name
) df
LEFT JOIN (
  SELECT tablespace_name, SUM(bytes) AS free_bytes
  FROM dba_free_space
  GROUP BY tablespace_name
) fs ON df.tablespace_name = fs.tablespace_name
LEFT JOIN dba_tablespaces ts ON df.tablespace_name = ts.tablespace_name
"""

[[metric]]
context = "oracle_temp_usage"
labels = ["tablespace_name"]
metricsdesc = { used_percent = "Temporary tablespace used percent", used_gb = "Temporary tablespace used GB", total_gb = "Temporary tablespace total GB" }
request = """
SELECT tf.tablespace_name,
       ROUND(NVL(tu.used_bytes, 0) / tf.total_bytes * 100, 2) AS used_percent,
       ROUND(NVL(tu.used_bytes, 0) / 1024 / 1024 / 1024, 2) AS used_gb,
       ROUND(tf.total_bytes / 1024 / 1024 / 1024, 2) AS total_gb
FROM (
  SELECT tablespace_name, SUM(bytes) AS total_bytes
  FROM dba_temp_files
  GROUP BY tablespace_name
) tf
LEFT JOIN (
  SELECT tablespace_name, SUM(bytes_used) AS used_bytes
  FROM v$temp_space_header
  GROUP BY tablespace_name
) tu ON tf.tablespace_name = tu.tablespace_name
"""

[[metric]]
context = "oracle_fra_usage"
labels = ["file_type"]
metricsdesc = { used_percent = "FRA used percent by file type", used_gb = "FRA used GB by file type", reclaimable_gb = "FRA reclaimable GB by file type" }
request = """
SELECT file_type,
       percent_space_used AS used_percent,
       ROUND(space_used / 1024 / 1024 / 1024, 2) AS used_gb,
       ROUND(space_reclaimable / 1024 / 1024 / 1024, 2) AS reclaimable_gb
FROM v$flash_recovery_area_usage
"""

[[metric]]
context = "oracle_fra_limit"
metricsdesc = { value = "FRA limit GB" }
request = """
SELECT ROUND(space_limit / 1024 / 1024 / 1024, 2) AS value
FROM v$recovery_file_dest
"""

[[metric]]
context = "oracle_rac_instance_status"
labels = ["inst_id", "instance_name", "host_name", "status"]
metricsdesc = { value = "RAC instance status" }
request = """
SELECT TO_CHAR(inst_id) AS inst_id,
       instance_name,
       host_name,
       status,
       1 AS value
FROM gv$instance
"""

[[metric]]
context = "oracle_rac_active_sessions"
labels = ["inst_id", "instance_name"]
metricsdesc = { value = "RAC active sessions by instance" }
request = """
SELECT TO_CHAR(s.inst_id) AS inst_id,
       i.instance_name,
       COUNT(*) AS value
FROM gv$session s
JOIN gv$instance i ON s.inst_id = i.inst_id
WHERE s.status = 'ACTIVE'
GROUP BY s.inst_id, i.instance_name
"""

[[metric]]
context = "oracle_rac_blocked_sessions"
labels = ["inst_id", "instance_name"]
metricsdesc = { value = "RAC blocked sessions by instance" }
request = """
SELECT TO_CHAR(s.inst_id) AS inst_id,
       i.instance_name,
       COUNT(*) AS value
FROM gv$session s
JOIN gv$instance i ON s.inst_id = i.inst_id
WHERE s.blocking_session IS NOT NULL
GROUP BY s.inst_id, i.instance_name
"""

[[metric]]
context = "oracle_rac_wait_class"
labels = ["inst_id", "instance_name", "wait_class"]
metricsdesc = { value = "RAC active sessions by wait class" }
request = """
SELECT TO_CHAR(s.inst_id) AS inst_id,
       i.instance_name,
       NVL(s.wait_class, 'UNKNOWN') AS wait_class,
       COUNT(*) AS value
FROM gv$session s
JOIN gv$instance i ON s.inst_id = i.inst_id
WHERE s.status = 'ACTIVE'
AND NVL(s.wait_class, 'UNKNOWN') <> 'Idle'
GROUP BY s.inst_id, i.instance_name, NVL(s.wait_class, 'UNKNOWN')
"""

[[metric]]
context = "oracle_rac_gc_waits"
labels = ["inst_id", "instance_name", "event"]
metricsdesc = { value = "RAC global cache waits" }
request = """
SELECT TO_CHAR(s.inst_id) AS inst_id,
       i.instance_name,
       s.event,
       COUNT(*) AS value
FROM gv$session s
JOIN gv$instance i ON s.inst_id = i.inst_id
WHERE s.status = 'ACTIVE'
AND s.event LIKE 'gc%'
GROUP BY s.inst_id, i.instance_name, s.event
"""

[[metric]]
context = "oracle_services_status"
labels = ["inst_id", "name", "network_name"]
metricsdesc = { value = "Oracle services status by instance" }
request = """
SELECT TO_CHAR(inst_id) AS inst_id,
       name,
       NVL(network_name, 'UNKNOWN') AS network_name,
       1 AS value
FROM gv$active_services
WHERE name NOT LIKE 'SYS$%'
"""

[[metric]]
context = "oracle_asm_diskgroup_usage"
labels = ["name", "state", "type"]
metricsdesc = { used_percent = "ASM diskgroup used percent", free_gb = "ASM diskgroup free GB", total_gb = "ASM diskgroup total GB" }
request = """
SELECT name,
       state,
       type,
       ROUND((total_mb - free_mb) / NULLIF(total_mb, 0) * 100, 2) AS used_percent,
       ROUND(free_mb / 1024, 2) AS free_gb,
       ROUND(total_mb / 1024, 2) AS total_gb
FROM v$asm_diskgroup
"""

[[metric]]
context = "oracle_asm_operation"
labels = ["group_number", "operation", "state", "power"]
metricsdesc = { value = "ASM rebalance or operation estimate minutes" }
request = """
SELECT TO_CHAR(group_number) AS group_number,
       operation,
       state,
       TO_CHAR(power) AS power,
       NVL(est_minutes, 0) AS value
FROM v$asm_operation
"""

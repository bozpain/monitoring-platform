[[metric]]
context = "oracle_long_running_sessions"
labels = ["sid", "serial", "username", "program", "machine", "status", "event", "sql_id"]
metricsdesc = { value = "Long running active sessions in seconds" }
request = "
SELECT TO_CHAR(sid) AS sid,
       TO_CHAR(serial#) AS serial,
       NVL(username, 'UNKNOWN') AS username,
       SUBSTR(NVL(program, 'UNKNOWN'), 1, 80) AS program,
       SUBSTR(NVL(machine, 'UNKNOWN'), 1, 80) AS machine,
       NVL(status, 'UNKNOWN') AS status,
       SUBSTR(NVL(event, 'UNKNOWN'), 1, 80) AS event,
       NVL(sql_id, 'UNKNOWN') AS sql_id,
       last_call_et AS value
FROM v$session
WHERE status = 'ACTIVE'
AND type = 'USER'
AND last_call_et >= 300
"


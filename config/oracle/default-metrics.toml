[[metric]]
context = "oracle_up"
metricsdesc = { value = "Oracle DB status" }
request = "SELECT 1 as value FROM dual"

[[metric]]
context = "sessions_total"
metricsdesc = { value = "Total sessions" }
request = "SELECT COUNT(*) as value FROM v$session"

[[metric]]
context = "sessions_active"
metricsdesc = { value = "Active sessions" }
request = "SELECT COUNT(*) as value FROM v$session WHERE status = 'ACTIVE'"

[[metric]]
context = "sessions_blocked"
metricsdesc = { value = "Blocked sessions" }
request = "SELECT COUNT(*) as value FROM v$session WHERE blocking_session IS NOT NULL"

# WAIT EVENTS (CORE DPA)
[[metric]]
context = "wait_events"
labels = ["event"]
metricsdesc = { value = "Wait event count" }
request = "
SELECT event, COUNT(*) as value
FROM v$session
WHERE wait_class <> 'Idle'
GROUP BY event
"

# CPU USAGE
[[metric]]
context = "cpu_usage"
metricsdesc = { value = "CPU usage" }
request = "
SELECT value as value
FROM v$sysmetric
WHERE metric_name = 'CPU Usage Per Sec'
AND rownum = 1
"

# DB TIME
[[metric]]
context = "db_time"
metricsdesc = { value = "Database time per second" }
request = "
SELECT value as value
FROM v$sysmetric
WHERE metric_name = 'Database Time Per Sec'
AND rownum = 1
"

# TOP SQL (HEAVY QUERIES)
[[metric]]
context = "top_sql_elapsed"
labels = ["sql_id"]
metricsdesc = { value = "Top SQL by elapsed time" }
request = "
SELECT sql_id, elapsed_time as value
FROM v$sql
WHERE rownum <= 10
ORDER BY elapsed_time DESC
"

# LOGICAL READS (LOAD INDICATOR)
[[metric]]
context = "logical_reads"
metricsdesc = { value = "Logical reads" }
request = "
SELECT value as value
FROM v$sysstat
WHERE name = 'session logical reads'
"

global:
  scrape_interval: 30s
  evaluation_interval: 30s

remote_write:
  - url: http://localhost:8428/api/v1/write
    queue_config:
      capacity: 10000
      max_shards: 30
      min_shards: 1
      max_samples_per_send: 2000
      batch_send_deadline: 5s
      min_backoff: 30ms
      max_backoff: 5s

rule_files:
  - /monitoring/prometheus/conf/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "localhost:9093"

scrape_configs:

  # =========================
  # PROMETHEUS SELF MONITORING
  # =========================
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          service: "prometheus"
          environment: "development"
          site: "development"
          team: "dba"
          role: "scrape-engine"
          db_type: "none"
          app: "monitoring-platform"
          tier: "shared"
          owner: "dba"

  # =========================
  # ALERTMANAGER SELF MONITORING
  # =========================
  - job_name: "alertmanager"
    static_configs:
      - targets:
          - "localhost:9093"
        labels:
          service: "alertmanager"
          environment: "development"
          site: "development"
          team: "dba"
          role: "alert-routing"
          db_type: "none"
          app: "monitoring-platform"
          tier: "shared"
          owner: "dba"

  # =========================
  # VICTORIAMETRICS STORAGE
  # =========================
  - job_name: "victoriametrics"
    static_configs:
      - targets:
          - "localhost:8428"
        labels:
          service: "victoriametrics"
          environment: "development"
          site: "development"
          team: "dba"
          role: "storage"
          db_type: "none"
          app: "monitoring-platform"
          tier: "shared"
          owner: "dba"

  # =========================
  # NODE EXPORTER
  # =========================
  - job_name: "node"
    file_sd_configs:
      - files:
          - /monitoring/config/targets/node_targets.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # =========================
  # ORACLE EXPORTER
  # =========================
  - job_name: "oracle"
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /monitoring/config/targets/oracle_targets.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # =========================
  # MSSQL EXPORTER
  # =========================
  - job_name: "mssql"
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /monitoring/config/targets/mssql_targets.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

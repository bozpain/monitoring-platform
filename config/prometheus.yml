global:
  scrape_interval: 15s
  evaluation_interval: 15s

remote_write:
  - url: "http://10.10.10.10:8428/api/v1/write"

rule_files:
  - "/monitoring/prometheus/conf/alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["10.10.10.10:9093"]

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets: ["10.10.10.10:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["10.10.10.10:9100"]

  - job_name: "oracle"
    static_configs:
      - targets: ["10.10.10.10:9161"]

  - job_name: "mssql"
    static_configs:
      - targets: ["10.10.10.10:9182"]

  - job_name: "postgres"
    static_configs:
      - targets: ["10.10.10.10:9187"]

  - job_name: "mongodb"
    static_configs:
      - targets: ["10.10.10.10:9216"]

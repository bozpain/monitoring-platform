groups:
  - name: oracle.rules
    interval: 30s
    rules:

      # =========================
      # AVAILABILITY
      # =========================
      - alert: OracleExporterDown
        expr: up{job="oracle"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
          db_type: oracle
        annotations:
          summary: "Oracle exporter down on {{ $labels.instance }}"
          description: "Exporter not reachable. App={{ $labels.app }}, Tier={{ $labels.tier }}"

      - alert: OracleDatabaseDown
        expr: oracle_up{job="oracle"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
          db_type: oracle
        annotations:
          summary: "Oracle database down on {{ $labels.instance }}"
          description: "Database is not responding."

      # =========================
      # CAPACITY
      # =========================
      - alert: OracleTablespaceHighUsage
        expr: oracle_tablespace_used_percent{job="oracle"} >= 85 and oracle_tablespace_used_percent{job="oracle"} < 95
        for: 5m
        labels:
          severity: warning
          category: capacity
          db_type: oracle
        annotations:
          summary: "Tablespace high usage on {{ $labels.instance }}"
          description: "{{ $labels.tablespace_name }} usage {{ $value }}%"

      - alert: OracleTablespaceCriticalUsage
        expr: oracle_tablespace_used_percent{job="oracle"} >= 95
        for: 5m
        labels:
          severity: critical
          category: capacity
          db_type: oracle
        annotations:
          summary: "Tablespace critical usage on {{ $labels.instance }}"
          description: "{{ $labels.tablespace_name }} usage {{ $value }}%"

      - alert: OracleArchiveHighUsage
        expr: oracle_archivelog_destination_used_percent{job="oracle"} >= 85 and oracle_archivelog_destination_used_percent{job="oracle"} < 95
        for: 5m
        labels:
          severity: warning
          category: capacity
          db_type: oracle
        annotations:
          summary: "Archive usage high on {{ $labels.instance }}"
          description: "Archive usage {{ $value }}%"

      - alert: OracleArchiveCriticalUsage
        expr: oracle_archivelog_destination_used_percent{job="oracle"} >= 95
        for: 5m
        labels:
          severity: critical
          category: capacity
          db_type: oracle
        annotations:
          summary: "Archive usage critical on {{ $labels.instance }}"
          description: "Archive usage {{ $value }}%"

      - alert: OracleTempTablespaceHighUsage
        expr: oracle_temp_usage_used_percent{job="oracle"} >= 80 and oracle_temp_usage_used_percent{job="oracle"} < 90
        for: 5m
        labels:
          severity: warning
          category: capacity
          db_type: oracle
        annotations:
          summary: "Temporary tablespace high usage on {{ $labels.instance }}"
          description: "{{ $labels.tablespace_name }} temp usage {{ $value }}%"

      - alert: OracleTempTablespaceCriticalUsage
        expr: oracle_temp_usage_used_percent{job="oracle"} >= 90
        for: 5m
        labels:
          severity: critical
          category: capacity
          db_type: oracle
        annotations:
          summary: "Temporary tablespace critical usage on {{ $labels.instance }}"
          description: "{{ $labels.tablespace_name }} temp usage {{ $value }}%"

      # =========================
      # SESSION
      # =========================
      - alert: OracleSessionHigh
        expr: oracle_sessions_used_percent{job="oracle"} >= 85 and oracle_sessions_used_percent{job="oracle"} < 95
        for: 5m
        labels:
          severity: warning
          category: session
          db_type: oracle
        annotations:
          summary: "Session usage high on {{ $labels.instance }}"
          description: "Session usage {{ $value }}%"

      - alert: OracleSessionCritical
        expr: oracle_sessions_used_percent{job="oracle"} >= 95
        for: 5m
        labels:
          severity: critical
          category: session
          db_type: oracle
        annotations:
          summary: "Session usage critical on {{ $labels.instance }}"
          description: "Session usage {{ $value }}%"

      # =========================
      # PERFORMANCE / DPA
      # =========================
      - alert: OracleBlockingSession
        expr: oracle_blocking_sessions{job="oracle"} > 0 and oracle_blocking_sessions{job="oracle"} < 5
        for: 3m
        labels:
          severity: warning
          category: blocking
          db_type: oracle
        annotations:
          summary: "Blocking session detected on {{ $labels.instance }}"
          description: "Blocking sessions > 0"
          runbook_url: "docs/runbooks/oracle/blocking.md"

      - alert: OracleSevereBlocking
        expr: oracle_blocking_sessions{job="oracle"} >= 5
        for: 3m
        labels:
          severity: critical
          category: blocking
          db_type: oracle
        annotations:
          summary: "Severe blocking on {{ $labels.instance }}"
          description: "Blocking sessions >= 5"
          runbook_url: "docs/runbooks/oracle/blocking.md"

      - alert: OracleDeadlockDetected
        expr: increase(oracle_deadlocks_total{job="oracle"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          category: locking
          db_type: oracle
        annotations:
          summary: "Deadlock detected on {{ $labels.instance }}"
          description: "Deadlock occurred in last 5 minutes"

      - alert: OracleLongRunningQuery
        expr: oracle_long_running_queries{job="oracle"} > 0
        for: 5m
        labels:
          severity: warning
          category: performance
          db_type: oracle
        annotations:
          summary: "Long running query on {{ $labels.instance }}"
          description: "Query running > 5 minutes"

      - alert: OracleHighWaitClassActivity
        expr: |
          sum by (instance, wait_class, app, tier, owner) (
            oracle_ash_like_wait_class_value{job="oracle", wait_class!~"Idle|UNKNOWN"}
          ) >= 10
        for: 10m
        labels:
          severity: warning
          category: wait
          db_type: oracle
        annotations:
          summary: "High Oracle wait activity on {{ $labels.instance }}"
          description: "Wait class {{ $labels.wait_class }} has >= 10 active sessions. Check top waits and SQL activity."
          runbook_url: "docs/runbooks/oracle/high_db_time.md"

      - alert: OracleHighDBTime
        expr: |
          sum by (instance, app, tier, owner) (
            oracle_db_time_per_sec_value{job="oracle"}
          ) >= 60
        for: 10m
        labels:
          severity: warning
          category: wait
          db_type: oracle
        annotations:
          summary: "High Oracle DB time on {{ $labels.instance }}"
          description: "DB time per second >= 60. Check wait class, top SQL, and host resource pressure."
          runbook_url: "docs/runbooks/oracle/high_db_time.md"

      - alert: OracleDBTimeAnomaly
        expr: |
          oracle_db_time_per_sec_value{job="oracle"} > 5
          and
          oracle_db_time_per_sec_value{job="oracle"} > 2 * oracle:db_time_per_sec:avg_7d{job="oracle"}
        for: 10m
        labels:
          severity: warning
          category: anomaly
          db_type: oracle
        annotations:
          summary: "Oracle DB time anomaly on {{ $labels.instance }}"
          description: "DB time is >2x its 7-day baseline. Check top wait events, top SQL rate, and recent plan changes."
          runbook_url: "docs/runbooks/oracle/high_db_time.md"

      - alert: OracleWaitClassAnomaly
        expr: |
          oracle_ash_like_wait_class_value{job="oracle", wait_class!~"Idle|UNKNOWN"} >= 5
          and
          oracle_ash_like_wait_class_value{job="oracle", wait_class!~"Idle|UNKNOWN"} > 2 * oracle:wait_class_active_sessions:avg_7d{job="oracle"}
        for: 10m
        labels:
          severity: warning
          category: anomaly
          db_type: oracle
        annotations:
          summary: "Oracle wait class anomaly on {{ $labels.instance }}"
          description: "Wait class {{ $labels.wait_class }} is >2x its 7-day baseline."
          runbook_url: "docs/runbooks/oracle/high_db_time.md"

      - alert: OraclePlanChangeRegression
        expr: |
          oracle:sql_elapsed_seconds_per_sec:rate5m > 1
          and
          oracle:sql_elapsed_seconds_per_sec:rate5m > 2 * oracle:sql_elapsed_seconds_per_sec:avg_6h
          and on (instance, sql_id)
          max by (instance, sql_id) (oracle:sql_plan_count >= 2)
        for: 10m
        labels:
          severity: warning
          category: sql-plan
          db_type: oracle
        annotations:
          summary: "Possible Oracle SQL plan regression on {{ $labels.instance }}"
          description: "SQL {{ $labels.sql_id }} has multiple cached plans and elapsed time rate is >2x its 6-hour baseline. Plan={{ $labels.plan_hash_value }}, module={{ $labels.module }}."
          runbook_url: "docs/runbooks/oracle/plan_regression.md"

      - alert: OracleLogFileSyncPressure
        expr: |
          sum by (instance, app, tier, owner) (
            oracle:active_sessions_by_sql_wait{event="log file sync"}
          ) >= 5
        for: 10m
        labels:
          severity: warning
          category: advisory
          db_type: oracle
        annotations:
          summary: "Oracle commit latency pressure on {{ $labels.instance }}"
          description: "Multiple active sessions are waiting on log file sync. Check commit frequency, redo I/O latency, and application commit batching."
          runbook_url: "docs/runbooks/oracle/log_file_sync.md"

      - alert: OracleSequentialReadPressure
        expr: |
          sum by (instance, app, tier, owner) (
            oracle:active_sessions_by_sql_wait{event="db file sequential read"}
          ) >= 10
        for: 10m
        labels:
          severity: warning
          category: advisory
          db_type: oracle
        annotations:
          summary: "Oracle single-block read pressure on {{ $labels.instance }}"
          description: "High db file sequential read activity. Check top SQL by disk reads per execution, index access paths, and storage latency."
          runbook_url: "docs/runbooks/oracle/db_file_sequential_read.md"

      - alert: OracleCursorContention
        expr: |
          sum by (instance, event, app, tier, owner) (
            oracle:active_sessions_by_sql_wait{event=~"cursor: pin S wait on X|library cache lock|library cache pin"}
          ) >= 3
        for: 5m
        labels:
          severity: warning
          category: advisory
          db_type: oracle
        annotations:
          summary: "Oracle cursor/library cache contention on {{ $labels.instance }}"
          description: "Event {{ $labels.event }} is active. Check parse storm, version count, recent deployments, and bind variable usage."
          runbook_url: "docs/runbooks/oracle/parse_storm.md"

      - alert: OracleParseStorm
        expr: |
          sum by (instance, sql_id, parsing_schema, module, app, tier, owner) (
            oracle:sql_parse_calls_per_sec:rate5m
          ) >= 50
        for: 10m
        labels:
          severity: warning
          category: advisory
          db_type: oracle
        annotations:
          summary: "Oracle parse storm on {{ $labels.instance }}"
          description: "SQL {{ $labels.sql_id }} parse calls are high. Module={{ $labels.module }}, schema={{ $labels.parsing_schema }}."
          runbook_url: "docs/runbooks/oracle/parse_storm.md"

      - alert: OracleInefficientLogicalIO
        expr: |
          oracle:sql_buffer_gets_per_exec:rate5m >= 100000
          and
          oracle:sql_executions_per_sec:rate5m > 0.1
        for: 15m
        labels:
          severity: warning
          category: advisory
          db_type: oracle
        annotations:
          summary: "Oracle SQL high logical I/O per execution on {{ $labels.instance }}"
          description: "SQL {{ $labels.sql_id }} is doing high buffer gets per execution. Check predicates, indexes, join order, and plan {{ $labels.plan_hash_value }}."
          runbook_url: "docs/runbooks/oracle/inefficient_logical_io.md"

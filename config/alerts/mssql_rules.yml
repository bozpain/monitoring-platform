groups:
  - name: mssql.rules
    interval: 30s
    rules:

      # =========================
      # AVAILABILITY
      # =========================
      - alert: MSSQLExporterDown
        expr: up{job="mssql"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
          db_type: mssql
        annotations:
          summary: "MSSQL exporter down on {{ $labels.instance }}"
          description: "Exporter not reachable. App={{ $labels.app }}, Tier={{ $labels.tier }}"

      - alert: MSSQLDatabaseDown
        expr: mssql_up{job="mssql"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
          db_type: mssql
        annotations:
          summary: "MSSQL database down on {{ $labels.instance }}"
          description: "Database not responding"

      - alert: MSSQLDatabaseNotOnline
        expr: mssql_database_state{job="mssql"} != 0
        for: 3m
        labels:
          severity: critical
          category: availability
          db_type: mssql
        annotations:
          summary: "Database not ONLINE on {{ $labels.instance }}"
          description: "Database {{ $labels.database }} state is not ONLINE"

      # =========================
      # CAPACITY
      # =========================
      - alert: MSSQLDataFileHighUsage
        expr: mssql_database_data_used_percent{job="mssql"} >= 85 and mssql_database_data_used_percent{job="mssql"} < 95
        for: 5m
        labels:
          severity: warning
          category: capacity
          db_type: mssql
        annotations:
          summary: "Data file high usage on {{ $labels.instance }}"
          description: "{{ $labels.database }} usage {{ $value }}%"

      - alert: MSSQLDataFileCriticalUsage
        expr: mssql_database_data_used_percent{job="mssql"} >= 95
        for: 5m
        labels:
          severity: critical
          category: capacity
          db_type: mssql
        annotations:
          summary: "Data file critical usage on {{ $labels.instance }}"
          description: "{{ $labels.database }} usage {{ $value }}%"

      - alert: MSSQLLogFileHighUsage
        expr: mssql_database_log_used_percent{job="mssql"} >= 80 and mssql_database_log_used_percent{job="mssql"} < 90
        for: 5m
        labels:
          severity: warning
          category: capacity
          db_type: mssql
        annotations:
          summary: "Log file high usage on {{ $labels.instance }}"
          description: "{{ $labels.database }} log usage {{ $value }}%"

      - alert: MSSQLLogFileCriticalUsage
        expr: mssql_database_log_used_percent{job="mssql"} >= 90
        for: 5m
        labels:
          severity: critical
          category: capacity
          db_type: mssql
        annotations:
          summary: "Log file critical usage on {{ $labels.instance }}"
          description: "{{ $labels.database }} log usage {{ $value }}%"

      - alert: MSSQLTempDBHighUsage
        expr: |
          (
            sum by (instance, app, tier, owner) (mssql_tempdb_used_bytes{job="mssql"})
            /
            clamp_min(sum by (instance, app, tier, owner) (mssql_tempdb_size_bytes{job="mssql"}), 1)
          ) >= 0.80
          and
          (
            sum by (instance, app, tier, owner) (mssql_tempdb_used_bytes{job="mssql"})
            /
            clamp_min(sum by (instance, app, tier, owner) (mssql_tempdb_size_bytes{job="mssql"}), 1)
          ) < 0.90
        for: 5m
        labels:
          severity: warning
          category: capacity
          db_type: mssql
        annotations:
          summary: "TempDB high usage on {{ $labels.instance }}"
          description: "TempDB usage > 80%"

      - alert: MSSQLTempDBCriticalUsage
        expr: |
          (
            sum by (instance, app, tier, owner) (mssql_tempdb_used_bytes{job="mssql"})
            /
            clamp_min(sum by (instance, app, tier, owner) (mssql_tempdb_size_bytes{job="mssql"}), 1)
          ) >= 0.90
        for: 5m
        labels:
          severity: critical
          category: capacity
          db_type: mssql
        annotations:
          summary: "TempDB critical usage on {{ $labels.instance }}"
          description: "TempDB usage > 90%"

      # =========================
      # PERFORMANCE
      # =========================
      - alert: MSSQLBlockingSession
        expr: mssql_blocked_sessions{job="mssql"} > 0 and mssql_blocked_sessions{job="mssql"} < 5
        for: 3m
        labels:
          severity: warning
          category: blocking
          db_type: mssql
        annotations:
          summary: "Blocking session detected on {{ $labels.instance }}"
          description: "Blocked sessions > 0"

      - alert: MSSQLSevereBlocking
        expr: mssql_blocked_sessions{job="mssql"} >= 5
        for: 3m
        labels:
          severity: critical
          category: blocking
          db_type: mssql
        annotations:
          summary: "Severe blocking on {{ $labels.instance }}"
          description: "Blocked sessions >= 5"

      - alert: MSSQLDeadlockDetected
        expr: increase(mssql_deadlocks_total{job="mssql"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          category: locking
          db_type: mssql
        annotations:
          summary: "Deadlock detected on {{ $labels.instance }}"
          description: "Deadlock occurred in last 5 minutes"

      - alert: MSSQLLongRunningQuery
        expr: mssql_long_running_requests{job="mssql"} > 0
        for: 5m
        labels:
          severity: warning
          category: performance
          db_type: mssql
        annotations:
          summary: "Long running query on {{ $labels.instance }}"
          description: "Query running > 5 minutes"

      - alert: MSSQLHighWaitTimeRate
        expr: |
          sum by (instance, app, tier, owner) (
            rate(mssql_wait_time_ms_total{job="mssql"}[5m])
          ) > 5000
        for: 10m
        labels:
          severity: warning
          category: wait
          db_type: mssql
        annotations:
          summary: "High SQL Server wait time on {{ $labels.instance }}"
          description: "Total wait time rate > 5000 ms/sec. Check top wait types and top SQL."

      - alert: MSSQLHighSignalWaitRatio
        expr: |
          (
            sum by (instance, app, tier, owner) (rate(mssql_signal_wait_time_ms_total{job="mssql"}[5m]))
            /
            clamp_min(sum by (instance, app, tier, owner) (rate(mssql_wait_time_ms_total{job="mssql"}[5m])), 1)
          ) > 0.25
        for: 10m
        labels:
          severity: warning
          category: cpu
          db_type: mssql
        annotations:
          summary: "High SQL Server signal wait ratio on {{ $labels.instance }}"
          description: "Signal waits are > 25% of total waits. Check CPU pressure and runnable workload."

      - alert: MSSQLReadLatencyHigh
        expr: |
          (
            sum by (instance, database, app, tier, owner) (rate(mssql_io_read_latency_ms_total{job="mssql"}[5m]))
            /
            clamp_min(sum by (instance, database, app, tier, owner) (rate(mssql_io_reads_total{job="mssql"}[5m])), 1)
          ) > 20
        for: 10m
        labels:
          severity: warning
          category: io
          db_type: mssql
        annotations:
          summary: "SQL Server read latency high on {{ $labels.instance }}"
          description: "Database {{ $labels.database }} read latency > 20ms/op."

      - alert: MSSQLWriteLatencyHigh
        expr: |
          (
            sum by (instance, database, app, tier, owner) (rate(mssql_io_write_latency_ms_total{job="mssql"}[5m]))
            /
            clamp_min(sum by (instance, database, app, tier, owner) (rate(mssql_io_writes_total{job="mssql"}[5m])), 1)
          ) > 20
        for: 10m
        labels:
          severity: warning
          category: io
          db_type: mssql
        annotations:
          summary: "SQL Server write latency high on {{ $labels.instance }}"
          description: "Database {{ $labels.database }} write latency > 20ms/op."

      # =========================
      # MEMORY
      # =========================
      - alert: MSSQLMemoryPressure
        expr: mssql_memory_grants_pending{job="mssql"} > 0
        for: 5m
        labels:
          severity: warning
          category: memory
          db_type: mssql
        annotations:
          summary: "Memory pressure on {{ $labels.instance }}"
          description: "Memory grants pending detected"

      - alert: MSSQLLowBufferCacheHitRatio
        expr: mssql_buffer_cache_hit_ratio{job="mssql"} < 0.90
        for: 10m
        labels:
          severity: warning
          category: memory
          db_type: mssql
        annotations:
          summary: "Low buffer cache hit ratio on {{ $labels.instance }}"
          description: "Buffer cache hit ratio < 90%"

      - alert: MSSQLPageLifeExpectancyLow
        expr: mssql_page_life_expectancy_seconds{job="mssql"} < 300
        for: 10m
        labels:
          severity: warning
          category: memory
          db_type: mssql
        annotations:
          summary: "Low page life expectancy on {{ $labels.instance }}"
          description: "Page life expectancy < 300 seconds. Check memory pressure and I/O."

      # =========================
      # CONNECTION
      # =========================
      - alert: MSSQLConnectionHigh
        expr: mssql_connections{job="mssql"} > 500
        for: 5m
        labels:
          severity: warning
          category: connection
          db_type: mssql
        annotations:
          summary: "High connections on {{ $labels.instance }}"
          description: "Connections > 500"

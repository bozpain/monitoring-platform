[[metric]]
context = "mssql_up"
metricsdesc = { value = "MSSQL database connection status" }
request = "SELECT 1 AS value"

[[metric]]
context = "mssql_sessions_total"
metricsdesc = { value = "Total SQL Server sessions" }
request = "SELECT COUNT(*) AS value FROM sys.dm_exec_sessions"

[[metric]]
context = "mssql_sessions_active"
metricsdesc = { value = "Active SQL Server requests" }
request = "SELECT COUNT(*) AS value FROM sys.dm_exec_requests WHERE session_id > 50"

[[metric]]
context = "mssql_sessions_blocked"
metricsdesc = { value = "Blocked SQL Server requests" }
request = "SELECT COUNT(*) AS value FROM sys.dm_exec_requests WHERE blocking_session_id <> 0"

[[metric]]
context = "mssql_wait_stats"
labels = ["wait_type"]
metricsdesc = { value = "SQL Server wait time ms" }
request = """
SELECT TOP 20
       wait_type,
       wait_time_ms AS value
FROM sys.dm_os_wait_stats
WHERE wait_type NOT LIKE 'SLEEP%'
AND wait_type NOT LIKE 'BROKER%'
AND wait_type NOT LIKE 'XE%'
AND wait_type NOT LIKE 'SQLTRACE%'
AND wait_type NOT LIKE 'CLR%'
ORDER BY wait_time_ms DESC
"""

[[metric]]
context = "mssql_blocking_tree"
labels = ["session_id", "blocking_session_id", "login_name", "host_name", "program_name", "wait_type"]
metricsdesc = { value = "SQL Server blocking relationship" }
request = """
SELECT
    CAST(r.session_id AS varchar(20)) AS session_id,
    CAST(r.blocking_session_id AS varchar(20)) AS blocking_session_id,
    ISNULL(s.login_name, 'UNKNOWN') AS login_name,
    ISNULL(s.host_name, 'UNKNOWN') AS host_name,
    ISNULL(s.program_name, 'UNKNOWN') AS program_name,
    ISNULL(r.wait_type, 'UNKNOWN') AS wait_type,
    1 AS value
FROM sys.dm_exec_requests r
JOIN sys.dm_exec_sessions s ON r.session_id = s.session_id
WHERE r.blocking_session_id <> 0
"""

[[metric]]
context = "mssql_active_requests"
labels = ["session_id", "login_name", "host_name", "program_name", "status", "wait_type"]
metricsdesc = { value = "Active request elapsed time seconds" }
request = """
SELECT
    CAST(r.session_id AS varchar(20)) AS session_id,
    ISNULL(s.login_name, 'UNKNOWN') AS login_name,
    ISNULL(s.host_name, 'UNKNOWN') AS host_name,
    ISNULL(s.program_name, 'UNKNOWN') AS program_name,
    ISNULL(r.status, 'UNKNOWN') AS status,
    ISNULL(r.wait_type, 'CPU/RUNNING') AS wait_type,
    DATEDIFF(second, r.start_time, GETDATE()) AS value
FROM sys.dm_exec_requests r
JOIN sys.dm_exec_sessions s ON r.session_id = s.session_id
WHERE r.session_id > 50
"""

[[metric]]
context = "mssql_top_sql_cpu"
labels = ["query_hash"]
metricsdesc = { value = "Top SQL by total worker time" }
request = """
SELECT TOP 20
       CONVERT(varchar(64), qs.query_hash, 1) AS query_hash,
       qs.total_worker_time AS value
FROM sys.dm_exec_query_stats qs
ORDER BY qs.total_worker_time DESC
"""

[[metric]]
context = "mssql_top_sql_elapsed"
labels = ["query_hash"]
metricsdesc = { value = "Top SQL by elapsed time" }
request = """
SELECT TOP 20
       CONVERT(varchar(64), qs.query_hash, 1) AS query_hash,
       qs.total_elapsed_time AS value
FROM sys.dm_exec_query_stats qs
ORDER BY qs.total_elapsed_time DESC
"""

[[metric]]
context = "mssql_top_sql_logical_reads"
labels = ["query_hash"]
metricsdesc = { value = "Top SQL by logical reads" }
request = """
SELECT TOP 20
       CONVERT(varchar(64), qs.query_hash, 1) AS query_hash,
       qs.total_logical_reads AS value
FROM sys.dm_exec_query_stats qs
ORDER BY qs.total_logical_reads DESC
"""

[[metric]]
context = "mssql_top_sql_executions"
labels = ["query_hash"]
metricsdesc = { value = "Top SQL by executions" }
request = """
SELECT TOP 20
       CONVERT(varchar(64), qs.query_hash, 1) AS query_hash,
       qs.execution_count AS value
FROM sys.dm_exec_query_stats qs
ORDER BY qs.execution_count DESC
"""

[[metric]]
context = "mssql_database_size"
labels = ["database_name"]
metricsdesc = { value = "Database size GB" }
request = """
SELECT
    DB_NAME(database_id) AS database_name,
    CAST(SUM(size) * 8.0 / 1024 / 1024 AS decimal(18,2)) AS value
FROM sys.master_files
GROUP BY database_id
"""

[[metric]]
context = "mssql_database_state"
labels = ["database", "state_desc", "recovery_model_desc"]
metricsdesc = { value = "Database state; 0 means online, non-zero means not online" }
request = """
SELECT
    name AS database,
    state_desc,
    recovery_model_desc,
    CASE WHEN state_desc = 'ONLINE' THEN 0 ELSE 1 END AS value
FROM sys.databases
"""

[[metric]]
context = "mssql_backup_age_hours"
labels = ["database_name"]
metricsdesc = { value = "Last full backup age hours" }
request = """
SELECT
    d.name AS database_name,
    ISNULL(DATEDIFF(hour, MAX(b.backup_finish_date), GETDATE()), 999999) AS value
FROM sys.databases d
LEFT JOIN msdb.dbo.backupset b
    ON d.name = b.database_name
   AND b.type = 'D'
GROUP BY d.name
"""

[[metric]]
context = "mssql_data_file_free_percent"
labels = ["database_name", "file_name", "type_desc"]
metricsdesc = { value = "Data/log file free percent" }
request = """
SELECT
    DB_NAME(mf.database_id) AS database_name,
    mf.name AS file_name,
    mf.type_desc,
    CAST((mf.size - FILEPROPERTY(mf.name, 'SpaceUsed')) * 100.0 / NULLIF(mf.size,0) AS decimal(18,2)) AS value
FROM sys.database_files mf
"""

[[metric]]
context = "mssql_batch_requests_total"
metricsdesc = { value = "Cumulative SQL Server batch requests" }
request = """
SELECT cntr_value AS value
FROM sys.dm_os_performance_counters
WHERE object_name LIKE '%:SQL Statistics%'
AND counter_name = 'Batch Requests/sec'
"""

[[metric]]
context = "mssql_sql_compilations_total"
metricsdesc = { value = "Cumulative SQL compilations" }
request = """
SELECT cntr_value AS value
FROM sys.dm_os_performance_counters
WHERE object_name LIKE '%:SQL Statistics%'
AND counter_name = 'SQL Compilations/sec'
"""

[[metric]]
context = "mssql_sql_recompilations_total"
metricsdesc = { value = "Cumulative SQL recompilations" }
request = """
SELECT cntr_value AS value
FROM sys.dm_os_performance_counters
WHERE object_name LIKE '%:SQL Statistics%'
AND counter_name = 'SQL Re-Compilations/sec'
"""

[[metric]]
context = "mssql_connections"
metricsdesc = { value = "Current SQL Server user connections" }
request = """
SELECT cntr_value AS value
FROM sys.dm_os_performance_counters
WHERE object_name LIKE '%:General Statistics%'
AND counter_name = 'User Connections'
"""

[[metric]]
context = "mssql_memory_grants_pending"
metricsdesc = { value = "Memory grants pending" }
request = """
SELECT cntr_value AS value
FROM sys.dm_os_performance_counters
WHERE object_name LIKE '%:Memory Manager%'
AND counter_name = 'Memory Grants Pending'
"""

[[metric]]
context = "mssql_page_life_expectancy_seconds"
metricsdesc = { value = "Page life expectancy in seconds" }
request = """
SELECT AVG(CAST(cntr_value AS float)) AS value
FROM sys.dm_os_performance_counters
WHERE object_name LIKE '%:Buffer Manager%'
AND counter_name = 'Page life expectancy'
"""

[[metric]]
context = "mssql_buffer_cache_hit_ratio"
metricsdesc = { value = "Buffer cache hit ratio as 0-1" }
request = """
SELECT
  CAST(MAX(CASE WHEN counter_name = 'Buffer cache hit ratio' THEN cntr_value END) AS float)
  /
  NULLIF(CAST(MAX(CASE WHEN counter_name = 'Buffer cache hit ratio base' THEN cntr_value END) AS float), 0) AS value
FROM sys.dm_os_performance_counters
WHERE object_name LIKE '%:Buffer Manager%'
AND counter_name IN ('Buffer cache hit ratio', 'Buffer cache hit ratio base')
"""

[[metric]]
context = "mssql_active_sessions"
metricsdesc = { value = "Active SQL Server sessions" }
request = """
SELECT COUNT(*) AS value
FROM sys.dm_exec_sessions
WHERE is_user_process = 1
AND status IN ('running', 'runnable')
"""

[[metric]]
context = "mssql_sleeping_sessions"
metricsdesc = { value = "Sleeping SQL Server sessions" }
request = """
SELECT COUNT(*) AS value
FROM sys.dm_exec_sessions
WHERE is_user_process = 1
AND status = 'sleeping'
"""

[[metric]]
context = "mssql_blocked_sessions"
metricsdesc = { value = "Blocked SQL Server requests" }
request = """
SELECT COUNT(*) AS value
FROM sys.dm_exec_requests
WHERE blocking_session_id <> 0
"""

[[metric]]
context = "mssql_long_running_requests"
labels = ["database"]
metricsdesc = { value = "Requests running longer than 5 minutes" }
request = """
SELECT
  DB_NAME(database_id) AS database,
  COUNT(*) AS value
FROM sys.dm_exec_requests
WHERE session_id > 50
AND start_time <= DATEADD(minute, -5, GETDATE())
GROUP BY DB_NAME(database_id)
"""

[[metric]]
context = "mssql_sessions_by_status"
labels = ["database", "status"]
metricsdesc = { value = "Sessions by database and status" }
request = """
SELECT
  ISNULL(DB_NAME(database_id), 'UNKNOWN') AS database,
  status,
  COUNT(*) AS value
FROM sys.dm_exec_sessions
WHERE is_user_process = 1
GROUP BY ISNULL(DB_NAME(database_id), 'UNKNOWN'), status
"""

[[metric]]
context = "mssql_sessions_by_login"
labels = ["database", "login_name"]
metricsdesc = { value = "Sessions by database and login" }
request = """
SELECT
  ISNULL(DB_NAME(database_id), 'UNKNOWN') AS database,
  ISNULL(login_name, 'UNKNOWN') AS login_name,
  COUNT(*) AS value
FROM sys.dm_exec_sessions
WHERE is_user_process = 1
GROUP BY ISNULL(DB_NAME(database_id), 'UNKNOWN'), ISNULL(login_name, 'UNKNOWN')
"""

[[metric]]
context = "mssql_sessions_by_host"
labels = ["database", "host_name"]
metricsdesc = { value = "Sessions by database and host" }
request = """
SELECT
  ISNULL(DB_NAME(database_id), 'UNKNOWN') AS database,
  ISNULL(host_name, 'UNKNOWN') AS host_name,
  COUNT(*) AS value
FROM sys.dm_exec_sessions
WHERE is_user_process = 1
GROUP BY ISNULL(DB_NAME(database_id), 'UNKNOWN'), ISNULL(host_name, 'UNKNOWN')
"""

[[metric]]
context = "mssql_session_info"
labels = ["database", "session_id", "status", "login_name", "host_name", "program_name", "client_interface_name", "cpu_time_ms", "memory_usage_pages", "open_transaction_count"]
metricsdesc = { value = "Current user session detail" }
request = """
SELECT TOP 100
  ISNULL(DB_NAME(database_id), 'UNKNOWN') AS database,
  CAST(session_id AS varchar(20)) AS session_id,
  ISNULL(status, 'UNKNOWN') AS status,
  ISNULL(login_name, 'UNKNOWN') AS login_name,
  ISNULL(host_name, 'UNKNOWN') AS host_name,
  SUBSTRING(ISNULL(program_name, 'UNKNOWN'), 1, 80) AS program_name,
  ISNULL(client_interface_name, 'UNKNOWN') AS client_interface_name,
  CAST(cpu_time AS varchar(30)) AS cpu_time_ms,
  CAST(memory_usage AS varchar(30)) AS memory_usage_pages,
  CAST(open_transaction_count AS varchar(30)) AS open_transaction_count,
  1 AS value
FROM sys.dm_exec_sessions
WHERE is_user_process = 1
ORDER BY cpu_time DESC
"""

[[metric]]
context = "mssql_blocking_session_info"
labels = ["database", "session_id", "blocking_session_id", "wait_type", "wait_time_ms", "wait_resource", "login_name", "host_name", "program_name", "sql_text"]
metricsdesc = { value = "Current blocking session detail" }
request = """
SELECT TOP 100
  ISNULL(DB_NAME(r.database_id), 'UNKNOWN') AS database,
  CAST(r.session_id AS varchar(20)) AS session_id,
  CAST(r.blocking_session_id AS varchar(20)) AS blocking_session_id,
  ISNULL(r.wait_type, 'UNKNOWN') AS wait_type,
  CAST(r.wait_time AS varchar(30)) AS wait_time_ms,
  ISNULL(r.wait_resource, 'UNKNOWN') AS wait_resource,
  ISNULL(s.login_name, 'UNKNOWN') AS login_name,
  ISNULL(s.host_name, 'UNKNOWN') AS host_name,
  SUBSTRING(ISNULL(s.program_name, 'UNKNOWN'), 1, 80) AS program_name,
  SUBSTRING(REPLACE(REPLACE(ISNULL(t.text, 'UNKNOWN'), CHAR(13), ' '), CHAR(10), ' '), 1, 240) AS sql_text,
  1 AS value
FROM sys.dm_exec_requests r
JOIN sys.dm_exec_sessions s ON r.session_id = s.session_id
OUTER APPLY sys.dm_exec_sql_text(r.sql_handle) t
WHERE r.blocking_session_id <> 0
ORDER BY r.wait_time DESC
"""

[[metric]]
context = "mssql_long_running_request_info"
labels = ["database", "session_id", "status", "command", "duration_seconds", "cpu_time_ms", "logical_reads", "reads", "writes", "wait_type", "blocking_session_id", "login_name", "host_name", "program_name", "sql_text"]
metricsdesc = { value = "Long running request detail" }
request = """
SELECT TOP 100
  ISNULL(DB_NAME(r.database_id), 'UNKNOWN') AS database,
  CAST(r.session_id AS varchar(20)) AS session_id,
  ISNULL(r.status, 'UNKNOWN') AS status,
  ISNULL(r.command, 'UNKNOWN') AS command,
  CAST(DATEDIFF(second, r.start_time, GETDATE()) AS varchar(30)) AS duration_seconds,
  CAST(r.cpu_time AS varchar(30)) AS cpu_time_ms,
  CAST(r.logical_reads AS varchar(30)) AS logical_reads,
  CAST(r.reads AS varchar(30)) AS reads,
  CAST(r.writes AS varchar(30)) AS writes,
  ISNULL(r.wait_type, 'CPU/RUNNING') AS wait_type,
  CAST(r.blocking_session_id AS varchar(20)) AS blocking_session_id,
  ISNULL(s.login_name, 'UNKNOWN') AS login_name,
  ISNULL(s.host_name, 'UNKNOWN') AS host_name,
  SUBSTRING(ISNULL(s.program_name, 'UNKNOWN'), 1, 80) AS program_name,
  SUBSTRING(REPLACE(REPLACE(ISNULL(t.text, 'UNKNOWN'), CHAR(13), ' '), CHAR(10), ' '), 1, 240) AS sql_text,
  1 AS value
FROM sys.dm_exec_requests r
JOIN sys.dm_exec_sessions s ON r.session_id = s.session_id
OUTER APPLY sys.dm_exec_sql_text(r.sql_handle) t
WHERE r.session_id > 50
AND r.start_time <= DATEADD(minute, -5, GETDATE())
ORDER BY DATEDIFF(second, r.start_time, GETDATE()) DESC
"""

[[metric]]
context = "mssql_wait_time_ms_total"
labels = ["wait_type"]
metricsdesc = { value = "Cumulative wait time by wait type in milliseconds" }
request = """
SELECT TOP 40
  wait_type,
  wait_time_ms AS value
FROM sys.dm_os_wait_stats
WHERE wait_type NOT LIKE 'SLEEP%'
AND wait_type NOT LIKE 'BROKER%'
AND wait_type NOT LIKE 'XE%'
AND wait_type NOT LIKE 'SQLTRACE%'
AND wait_type NOT LIKE 'CLR%'
AND wait_type NOT LIKE 'HADR_FILESTREAM%'
AND wait_type NOT IN ('LAZYWRITER_SLEEP', 'SQLTRACE_BUFFER_FLUSH', 'REQUEST_FOR_DEADLOCK_SEARCH', 'LOGMGR_QUEUE', 'CHECKPOINT_QUEUE', 'CLR_AUTO_EVENT', 'CLR_MANUAL_EVENT')
ORDER BY wait_time_ms DESC
"""

[[metric]]
context = "mssql_signal_wait_time_ms_total"
labels = ["wait_type"]
metricsdesc = { value = "Cumulative signal wait time by wait type in milliseconds" }
request = """
SELECT TOP 40
  wait_type,
  signal_wait_time_ms AS value
FROM sys.dm_os_wait_stats
WHERE wait_type NOT LIKE 'SLEEP%'
AND wait_type NOT LIKE 'BROKER%'
AND wait_type NOT LIKE 'XE%'
AND wait_type NOT LIKE 'SQLTRACE%'
AND wait_type NOT LIKE 'CLR%'
AND wait_type NOT LIKE 'HADR_FILESTREAM%'
AND wait_type NOT IN ('LAZYWRITER_SLEEP', 'SQLTRACE_BUFFER_FLUSH', 'REQUEST_FOR_DEADLOCK_SEARCH', 'LOGMGR_QUEUE', 'CHECKPOINT_QUEUE', 'CLR_AUTO_EVENT', 'CLR_MANUAL_EVENT')
ORDER BY wait_time_ms DESC
"""

[[metric]]
context = "mssql_lock_waits_total"
metricsdesc = { value = "Cumulative lock wait count" }
request = """
SELECT cntr_value AS value
FROM sys.dm_os_performance_counters
WHERE object_name LIKE '%:Locks%'
AND counter_name = 'Lock Waits/sec'
AND instance_name = '_Total'
"""

[[metric]]
context = "mssql_deadlocks_total"
metricsdesc = { value = "Cumulative deadlock count" }
request = """
SELECT cntr_value AS value
FROM sys.dm_os_performance_counters
WHERE object_name LIKE '%:Locks%'
AND counter_name = 'Number of Deadlocks/sec'
AND instance_name = '_Total'
"""

[[metric]]
context = "mssql_transactions_total"
labels = ["database"]
metricsdesc = { value = "Cumulative transactions by database" }
request = """
SELECT
  instance_name AS database,
  cntr_value AS value
FROM sys.dm_os_performance_counters
WHERE object_name LIKE '%:Databases%'
AND counter_name = 'Transactions/sec'
AND instance_name NOT IN ('_Total', 'mssqlsystemresource')
"""

[[metric]]
context = "mssql_database_size_bytes"
labels = ["database"]
metricsdesc = { value = "Database allocated size in bytes" }
request = """
SELECT
  DB_NAME(database_id) AS database,
  SUM(CAST(size AS bigint)) * 8 * 1024 AS value
FROM sys.master_files
GROUP BY database_id
"""

[[metric]]
context = "mssql_database_data_used_bytes"
labels = ["database"]
metricsdesc = { value = "Allocated data file size in bytes" }
request = """
SELECT
  DB_NAME(database_id) AS database,
  SUM(CAST(size AS bigint)) * 8 * 1024 AS value
FROM sys.master_files
WHERE type_desc = 'ROWS'
GROUP BY database_id
"""

[[metric]]
context = "mssql_database_data_used_percent"
labels = ["database"]
metricsdesc = { value = "Allocated data file percent of total database size" }
request = """
SELECT
  DB_NAME(database_id) AS database,
  CAST(
    SUM(CASE WHEN type_desc = 'ROWS' THEN CAST(size AS bigint) ELSE 0 END) * 100.0
    / NULLIF(SUM(CAST(size AS bigint)), 0)
    AS decimal(18,2)
  ) AS value
FROM sys.master_files
GROUP BY database_id
"""

[[metric]]
context = "mssql_database_log_used_bytes"
labels = ["database"]
metricsdesc = { value = "Log file size in bytes" }
request = """
SELECT
  DB_NAME(database_id) AS database,
  SUM(CAST(size AS bigint)) * 8 * 1024 AS value
FROM sys.master_files
WHERE type_desc = 'LOG'
GROUP BY database_id
"""

[[metric]]
context = "mssql_database_log_used_percent"
labels = ["database"]
metricsdesc = { value = "SQL Server log used percent by database" }
request = """
SELECT
  instance_name AS database,
  cntr_value AS value
FROM sys.dm_os_performance_counters
WHERE object_name LIKE '%:Databases%'
AND counter_name = 'Percent Log Used'
AND instance_name NOT IN ('_Total', 'mssqlsystemresource')
"""

[[metric]]
context = "mssql_database_file_size_bytes"
labels = ["database", "logical_name", "file_type", "physical_name", "state"]
metricsdesc = { value = "Database file size in bytes" }
request = """
SELECT
  DB_NAME(database_id) AS database,
  name AS logical_name,
  type_desc AS file_type,
  SUBSTRING(physical_name, 1, 180) AS physical_name,
  state_desc AS state,
  CAST(size AS bigint) * 8 * 1024 AS value
FROM sys.master_files
"""

[[metric]]
context = "mssql_tempdb_size_bytes"
metricsdesc = { value = "TempDB total file size in bytes" }
request = """
SELECT SUM(CAST(size AS bigint)) * 8 * 1024 AS value
FROM tempdb.sys.database_files
"""

[[metric]]
context = "mssql_tempdb_used_bytes"
metricsdesc = { value = "TempDB used bytes" }
request = """
SELECT
  SUM(CAST(user_object_reserved_page_count + internal_object_reserved_page_count + version_store_reserved_page_count + mixed_extent_page_count AS bigint)) * 8 * 1024 AS value
FROM tempdb.sys.dm_db_file_space_usage
"""

[[metric]]
context = "mssql_tempdb_user_object_bytes"
metricsdesc = { value = "TempDB user object reserved bytes" }
request = """
SELECT SUM(CAST(user_object_reserved_page_count AS bigint)) * 8 * 1024 AS value
FROM tempdb.sys.dm_db_file_space_usage
"""

[[metric]]
context = "mssql_tempdb_internal_object_bytes"
metricsdesc = { value = "TempDB internal object reserved bytes" }
request = """
SELECT SUM(CAST(internal_object_reserved_page_count AS bigint)) * 8 * 1024 AS value
FROM tempdb.sys.dm_db_file_space_usage
"""

[[metric]]
context = "mssql_tempdb_version_store_bytes"
metricsdesc = { value = "TempDB version store reserved bytes" }
request = """
SELECT SUM(CAST(version_store_reserved_page_count AS bigint)) * 8 * 1024 AS value
FROM tempdb.sys.dm_db_file_space_usage
"""

[[metric]]
context = "mssql_io_reads_total"
labels = ["database", "file_type"]
metricsdesc = { value = "Cumulative physical reads by database file type" }
request = """
SELECT
  DB_NAME(vfs.database_id) AS database,
  mf.type_desc AS file_type,
  SUM(vfs.num_of_reads) AS value
FROM sys.dm_io_virtual_file_stats(NULL, NULL) vfs
JOIN sys.master_files mf
  ON vfs.database_id = mf.database_id
 AND vfs.file_id = mf.file_id
GROUP BY DB_NAME(vfs.database_id), mf.type_desc
"""

[[metric]]
context = "mssql_io_writes_total"
labels = ["database", "file_type"]
metricsdesc = { value = "Cumulative physical writes by database file type" }
request = """
SELECT
  DB_NAME(vfs.database_id) AS database,
  mf.type_desc AS file_type,
  SUM(vfs.num_of_writes) AS value
FROM sys.dm_io_virtual_file_stats(NULL, NULL) vfs
JOIN sys.master_files mf
  ON vfs.database_id = mf.database_id
 AND vfs.file_id = mf.file_id
GROUP BY DB_NAME(vfs.database_id), mf.type_desc
"""

[[metric]]
context = "mssql_io_read_latency_ms_total"
labels = ["database", "file_type"]
metricsdesc = { value = "Cumulative read stall in milliseconds" }
request = """
SELECT
  DB_NAME(vfs.database_id) AS database,
  mf.type_desc AS file_type,
  SUM(vfs.io_stall_read_ms) AS value
FROM sys.dm_io_virtual_file_stats(NULL, NULL) vfs
JOIN sys.master_files mf
  ON vfs.database_id = mf.database_id
 AND vfs.file_id = mf.file_id
GROUP BY DB_NAME(vfs.database_id), mf.type_desc
"""

[[metric]]
context = "mssql_io_write_latency_ms_total"
labels = ["database", "file_type"]
metricsdesc = { value = "Cumulative write stall in milliseconds" }
request = """
SELECT
  DB_NAME(vfs.database_id) AS database,
  mf.type_desc AS file_type,
  SUM(vfs.io_stall_write_ms) AS value
FROM sys.dm_io_virtual_file_stats(NULL, NULL) vfs
JOIN sys.master_files mf
  ON vfs.database_id = mf.database_id
 AND vfs.file_id = mf.file_id
GROUP BY DB_NAME(vfs.database_id), mf.type_desc
"""

[[metric]]
context = "mssql_query_cpu_time_ms"
labels = ["database", "query_hash", "query_text"]
metricsdesc = { value = "Top cached queries by total CPU time in milliseconds" }
request = """
SELECT TOP 20
  ISNULL(DB_NAME(st.dbid), 'UNKNOWN') AS database,
  CONVERT(varchar(64), qs.query_hash, 1) AS query_hash,
  SUBSTRING(REPLACE(REPLACE(ISNULL(st.text, 'UNKNOWN'), CHAR(13), ' '), CHAR(10), ' '), 1, 240) AS query_text,
  qs.total_worker_time / 1000 AS value
FROM sys.dm_exec_query_stats qs
CROSS APPLY sys.dm_exec_sql_text(qs.sql_handle) st
WHERE qs.query_hash IS NOT NULL
ORDER BY qs.total_worker_time DESC
"""

[[metric]]
context = "mssql_query_duration_ms"
labels = ["database", "query_hash", "query_text"]
metricsdesc = { value = "Top cached queries by total duration in milliseconds" }
request = """
SELECT TOP 20
  ISNULL(DB_NAME(st.dbid), 'UNKNOWN') AS database,
  CONVERT(varchar(64), qs.query_hash, 1) AS query_hash,
  SUBSTRING(REPLACE(REPLACE(ISNULL(st.text, 'UNKNOWN'), CHAR(13), ' '), CHAR(10), ' '), 1, 240) AS query_text,
  qs.total_elapsed_time / 1000 AS value
FROM sys.dm_exec_query_stats qs
CROSS APPLY sys.dm_exec_sql_text(qs.sql_handle) st
WHERE qs.query_hash IS NOT NULL
ORDER BY qs.total_elapsed_time DESC
"""

[[metric]]
context = "mssql_query_logical_reads"
labels = ["database", "query_hash", "query_text"]
metricsdesc = { value = "Top cached queries by logical reads" }
request = """
SELECT TOP 20
  ISNULL(DB_NAME(st.dbid), 'UNKNOWN') AS database,
  CONVERT(varchar(64), qs.query_hash, 1) AS query_hash,
  SUBSTRING(REPLACE(REPLACE(ISNULL(st.text, 'UNKNOWN'), CHAR(13), ' '), CHAR(10), ' '), 1, 240) AS query_text,
  qs.total_logical_reads AS value
FROM sys.dm_exec_query_stats qs
CROSS APPLY sys.dm_exec_sql_text(qs.sql_handle) st
WHERE qs.query_hash IS NOT NULL
ORDER BY qs.total_logical_reads DESC
"""

